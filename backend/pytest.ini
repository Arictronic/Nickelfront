[pytest]
testpaths = ../tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
pythonpath = ../backend .. ../parser_alpha
addopts = -v --tb=short -m "not external"
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
markers =
    unit: Unit tests
    integration: Integration tests
    external: Tests that call real external services and are skipped by default
    e2e: End-to-end tests
